name: Extract project zip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          ZIP=$(ls *.zip | head -n1)
          [ -n "$ZIP" ] || { echo "ไม่พบไฟล์ .zip ที่ราก repo"; exit 1; }
          mkdir /tmp/x && unzip -q "$ZIP" -d /tmp/x
          rm -rf /tmp/x/__MACOSX
          SRC=$(find /tmp/x -maxdepth 2 -name package.json -printf '%h\n' | head -n1)
          [ -n "$SRC" ] || { echo "ไม่พบ package.json ใน zip"; exit 1; }
          cp -a "$SRC"/. .
          rm -f "$ZIP"
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Extract project from zip" || echo "nothing to commit"
          git push
